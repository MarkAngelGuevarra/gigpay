# Runs on every push and pull request to main. Needs no secrets and never contacts Stellar or Supabase:
# the JS and Vitest suites are offline, and the latency test blocks every request that leaves its local server.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    name: Web app (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Clean install (D4)
        run: npm ci

      - name: Lint and typecheck
        run: |
          npm run lint
          npx eslint scripts/*.mjs
          npm run typecheck

      - name: Offline Node suites
        run: npm test

      - name: Vitest unit and component suites
        run: npm run test:unit

      - name: Standalone offline harnesses
        run: |
          node test/adversarial_challenger_m2.test.js
          node test/mobile_layout_harness.test.js
          node test/pilot_feedback_enforcement.test.js
          node test/cross_device_ledger_sync.test.js
          node test/milestone2_remediation.test.js
          node test/onboarding_empirical_challenge.test.js
          node test/adversarial_challenger_stress.test.js
          node test/adversarial_stress_sync.test.js
          node test/pilot_guide_widget.test.js
          node src/test/soroban_sim.test.js

      - name: Production build
        run: npm run build

      - name: Install Chromium for the latency test
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: D1 cross-tab sync latency (p95 < 500 ms, two local tabs)
        run: npm run test:latency

  contract:
    name: Soroban contract (Rust stable)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/gigpay_escrow
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/gigpay_escrow

      - name: Contract unit tests
        run: cargo test --locked
